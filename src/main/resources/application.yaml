debug: false
server:
    port: 8082
spring:
    application:
        name: WebConsumer
    rabbitmq:
        host: ${RABBITMQ_HOST:localhost}
        port: ${RABBITMQ_PORT:5672}
        username: ${RABBITMQ_USERNAME:guest}
        password: ${RABBITMQ_PASSWORD:guest}
        virtual-host: ${RABBITMQ_VHOST:/}

rabbit-mq:
    default:
        exchange: binance.trade.exchange
binance:
    web-socket-url: ${BINANCE_WS_URL:wss://fstream.binance.com/ws}
    api-key: ${BINANCE_API_KEY:}
    symbols:
        - btcusdt@trade
#        - ethusdt@trade
#        - bnbusdt@trade
#        - xrpusdt@trade
#        - solusdt@trade


#Observability config
management:
    endpoints:
        web:
            exposure:
                include: health,prometheus,metrics,info
    endpoint:
        health:
            show-details: always
            show-components: always
    health:
        rabbit:
            enabled: true
    prometheus:
        metrics:
            export:
                enabled: true